<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes — Personal Habit Tracker</title>

    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devchauhann/fonts@v1.1.0/cdn/v1/css/all.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

    <div class="course-page" id="course-root">

        <!-- Back button -->
        <nav class="course-nav">
            <a href="../index.html" class="btn-back"><i data-lucide="arrow-left"></i> Back to Dashboard</a>
        </nav>

        <!-- Course info -->
        <div class="course-header">
            <input class="course-header__title" type="text" id="editor-title" placeholder="Nama course" autocomplete="off">
            <div class="course-header__badges">
                <input class="badge-input" type="text" id="editor-role" placeholder="Role" autocomplete="off">
                <input class="badge-input" type="text" id="editor-category" placeholder="Category" autocomplete="off">
                <input class="badge-input" type="text" id="editor-company" placeholder="Company" autocomplete="off">
            </div>
        </div>

        <!-- Quill Editor -->
        <div class="card">
            <div class="editor-header">
                <h2 class="text-xl font-bold text-primary font-serif">Course Notes</h2>
                <div class="editor-header__actions">
                    <button type="button" class="btn btn-secondary btn-sm" id="mermaid-open-btn">
                        <i data-lucide="workflow"></i> Diagram
                    </button>
                    <div class="btn-group editor-mode-toggle" id="editor-mode-toggle">
                        <button type="button" class="btn-group__item btn-group__item--active" data-mode="rich">Rich Text</button>
                        <button type="button" class="btn-group__item" data-mode="md">Markdown</button>
                    </div>
                </div>
            </div>
            <div id="view-bar" class="hidden">
                <div class="view-bar__zoom" id="view-zoom">
                    <button type="button" class="btn btn-ghost btn-sm" id="zoom-out" title="Zoom out">
                        <i data-lucide="minus"></i>
                    </button>
                    <span class="view-bar__zoom-label" id="zoom-label">100%</span>
                    <button type="button" class="btn btn-ghost btn-sm" id="zoom-in" title="Zoom in">
                        <i data-lucide="plus"></i>
                    </button>
                </div>
                <button type="button" class="btn btn-ghost btn-sm" id="edit-btn">
                    <i data-lucide="pencil"></i> Edit
                </button>
            </div>
            <div id="rich-editor-wrap">
                <div id="editor-container"></div>
            </div>
            <div id="md-editor-wrap" class="hidden">
                <textarea id="md-editor" placeholder="Tulis catatan dalam Markdown..."></textarea>
                <div id="md-preview" class="md-preview"></div>
            </div>
            <div class="editor-actions">
                <span class="editor-status" id="editor-status"></span>
                <div class="editor-actions__right">
                    <button class="btn btn-ghost" id="editor-delete-btn"><i data-lucide="trash-2"></i> Hapus</button>
                    <button class="btn btn-primary" id="editor-save-btn"><i data-lucide="check"></i> Simpan</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Mermaid Modal -->
    <div class="modal-overlay" id="mermaid-modal">
        <div class="modal" style="max-width:600px;">
            <h3 class="modal__title">Tambah Diagram Mermaid</h3>
            <div class="modal__form">
                <div class="modal__field">
                    <label class="modal__label">Kode Mermaid</label>
                    <textarea class="modal__input" id="mermaid-code" rows="8"
                        placeholder="graph TD;&#10;  A[Start] --> B[End]"
                        style="font-family:var(--font-mono);font-size:var(--text-sm);resize:vertical;"></textarea>
                </div>
                <div class="modal__field">
                    <label class="modal__label">Preview</label>
                    <div id="mermaid-preview" class="ql-mermaid-preview"></div>
                </div>
                <div class="modal__actions">
                    <button class="btn btn-ghost" id="mermaid-cancel">Batal</button>
                    <button class="btn btn-secondary" id="mermaid-preview-btn"><i data-lucide="eye"></i>
                        Preview</button>
                    <button class="btn btn-primary" id="mermaid-insert"><i data-lucide="plus"></i> Insert</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Modal (self-contained, tidak bergantung ke index.html) -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal modal--confirm">
            <h3 class="modal__title" id="confirm-title">Konfirmasi</h3>
            <p class="modal__body" id="confirm-body"></p>
            <div class="modal__actions">
                <button class="btn btn-ghost" id="confirm-cancel">Batal</button>
                <button class="btn btn-primary" id="confirm-ok"><i data-lucide="check"></i> Ya</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@latest/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7/dist/turndown.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/lib/common.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });</script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/data-study.js"></script>
    <script src="../assets/js/study-db.js"></script>
    <script src="../assets/js/dashboard-i18n.js"></script>
    <script src="../assets/js/dashboard-core.js"></script>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var courseId = params.get('id');
            var saveTimer = null;
            var statusEl = document.getElementById('editor-status');
            var mermaidInsertIndex = null;
            var confirmCallback = null;
            var noteMode = 'rich';
            var viewMode = false;
            var VIEW_KEY = 'course_notes_view';
            var pbZoomMin = 0.8, pbZoomMax = 2, pbZoomStep = 0.1;
            var pbZoom = parseFloat(localStorage.getItem('course_view_zoom')) || 1;
            if (isNaN(pbZoom) || pbZoom < pbZoomMin || pbZoom > pbZoomMax) pbZoom = 1;
            function setPbZoom(v) {
                pbZoom = Math.min(pbZoomMax, Math.max(pbZoomMin, v));
                try { localStorage.setItem('course_view_zoom', '' + pbZoom); } catch (e) {}
                document.documentElement.style.setProperty('--pb-zoom', '' + pbZoom);
                var lbl = document.getElementById('zoom-label');
                if (lbl) lbl.textContent = Math.round(pbZoom * 100) + '%';
            }
            var mdEditor = document.getElementById('md-editor');
            var mdPreview = document.getElementById('md-preview');
            var mdWrap = document.getElementById('md-editor-wrap');
            var richWrap = document.getElementById('rich-editor-wrap');
            var modeToggle = document.getElementById('editor-mode-toggle');

            if (!courseId) {
                document.getElementById('course-root').innerHTML =
                    '<nav class="course-nav"><a href="../index.html" class="btn-back"><i data-lucide="arrow-left"></i> Back to Dashboard</a></nav>' +
                    '<div class="card" style="padding:var(--space-10);text-align:center;margin-top:var(--space-8);"><p class="text-muted">Course not found.</p></div>';
                if (window.lucide) lucide.createIcons();
                return;
            }

            /* Terapkan tema multi-theme dari settings (sama seperti dashboard) */
            var _themeSettings = (typeof loadSettings === 'function') ? loadSettings() : null;
            if (_themeSettings && typeof applyTheme === 'function') applyTheme(_themeSettings.theme, _themeSettings.lightTheme);

            /* Init Quill — toolbar tanpa custom format button (mencegah toolbar rusak/overflow).
               Mermaid diinsert lewat tombol terpisah "Diagram" di header card. */
            var quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
                        [{ 'font': [] }],
                        [{ 'size': ['small', false, 'large', 'huge'] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'script': 'sub' }, { 'script': 'super' }],
                        ['blockquote', 'code-block'],
                        [{ 'list': 'ordered' }, { 'list': 'bullet' }, { 'indent': '-1' }, { 'indent': '+1' }],
                        [{ 'direction': 'rtl' }, { 'align': [] }],
                        ['link', 'formula'],
                        ['undo', 'redo'],
                        ['clean']
                    ]
                },
                placeholder: 'Tulis catatan course Anda di sini...'
            });

            /* Konfigurasi marked — KaTeX + syntax highlight untuk preview markdown */
            if (typeof marked !== 'undefined') {
                marked.setOptions({ gfm: true, breaks: true });
                if (typeof katex !== 'undefined') {
                    marked.use({
                        extensions: [
                            {
                                name: 'inlineMath', level: 'inline',
                                start: function (src) { return src.match(/\$/) ? src.match(/\$/).index : undefined; },
                                tokenizer: function (src) {
                                    var m = src.match(/^\$([^$\n]+?)\$/);
                                    return m ? { type: 'inlineMath', raw: m[0], text: m[1] } : undefined;
                                },
                                renderer: function (t) {
                                    return '<span class="md-inline-math">' + katex.renderToString(t.text, { throwOnError: false }) + '</span>';
                                }
                            },
                            {
                                name: 'blockMath', level: 'block',
                                start: function (src) { return src.match(/\$\$/) ? src.match(/\$\$/).index : undefined; },
                                tokenizer: function (src) {
                                    var m = src.match(/^\$\$([\s\S]+?)\$\$/);
                                    return m ? { type: 'blockMath', raw: m[0], text: m[1].trim() } : undefined;
                                },
                                renderer: function (t) {
                                    return '<div class="md-math">' + katex.renderToString(t.text, { displayMode: true, throwOnError: false }) + '</div>';
                                }
                            }
                        ]
                    });
                }
                if (typeof hljs !== 'undefined') {
                    marked.use({
                        renderer: {
                            code: function (code, lang) {
                                var valid = lang && hljs.getLanguage(lang);
                                var hl = valid ? hljs.highlight(code, { language: lang }).value : hljs.highlightAuto(code).value;
                                return '<pre><code class="hljs language-' + (lang || 'plaintext') + '">' + hl + '</code></pre>';
                            }
                        }
                    });
                }
            }

            /* Load existing course info & notes */
            function loadCourseInfo() {
                try {
                    var raw = localStorage.getItem('custom_courses');
                    if (raw) {
                        var list = JSON.parse(raw);
                        var course = list.find(function (c) { return c.id === courseId; });
                        if (course) {
                            document.getElementById('editor-title').value = course.title || '';
                            document.getElementById('editor-role').value = course.role || '';
                            document.getElementById('editor-category').value = course.subCategory || '';
                            document.getElementById('editor-company').value = course.company || '';
                        }
                    }
                } catch (e) { }
            }

            function loadNotes() {
                var allNotes = loadCourseNotes();
                var note = allNotes[courseId];
                if (note) {
                    if (note.title) document.getElementById('editor-title').value = note.title;
                    if (note.badges) {
                        if (note.badges.role) document.getElementById('editor-role').value = note.badges.role;
                        if (note.badges.subCategory) document.getElementById('editor-category').value = note.badges.subCategory;
                        if (note.badges.company) document.getElementById('editor-company').value = note.badges.company;
                    }
                    noteMode = note.mode === 'md' ? 'md' : 'rich';
                    if (noteMode === 'md') {
                        mdEditor.value = note.content || '';
                        setEditorMode('md');
                        updateMdPreview();
                    } else {
                        if (note.content) {
                            quill.root.innerHTML = note.content;
                            renderAllMermaidBlocks();
                        }
                        setEditorMode('rich');
                    }
                } else {
                    noteMode = 'rich';
                    setEditorMode('rich');
                }
                updateTitle();
            }

            function updateTitle() {
                var t = document.getElementById('editor-title').value.trim();
                document.title = (t || 'Course Notes') + ' \u2014 Personal Habit Tracker';
            }

            function setStatus(msg, isError) {
                statusEl.textContent = msg;
                statusEl.style.color = isError ? 'var(--color-danger)' : 'var(--color-sage)';
                clearTimeout(statusEl._timer);
                statusEl._timer = setTimeout(function () { statusEl.textContent = ''; }, 3000);
            }

            /* ======== VIEW MODE — tampilan preview setelah Simpan (persisten per course) ======== */
            function loadCourseViewState() {
                try { return JSON.parse(localStorage.getItem(VIEW_KEY)) || {}; } catch (e) { return {}; }
            }
            function saveCourseViewState(s) { localStorage.setItem(VIEW_KEY, JSON.stringify(s)); }
            function setCourseViewed(id, val) {
                var s = loadCourseViewState();
                if (val) s[id] = true; else delete s[id];
                saveCourseViewState(s);
            }
            function isCourseViewed(id) { return !!loadCourseViewState()[id]; }

            function enterViewMode() {
                viewMode = true;
                document.body.classList.add('pb-view-mode');
                setPbZoom(pbZoom);
                if (noteMode === 'md') updateMdPreview();
                document.getElementById('view-bar').classList.remove('hidden');
                document.getElementById('mermaid-open-btn').classList.add('hidden');
                modeToggle.classList.add('hidden');
                document.getElementById('editor-save-btn').classList.add('hidden');
                document.getElementById('editor-delete-btn').classList.add('hidden');
                ['editor-title', 'editor-role', 'editor-category', 'editor-company'].forEach(function (id) {
                    document.getElementById(id).readOnly = true;
                });
                if (noteMode === 'md') {
                    mdEditor.classList.add('hidden');
                } else {
                    richWrap.classList.add('view-mode');
                    quill.enable(false);
                }
            }

            function exitViewMode() {
                viewMode = false;
                document.body.classList.remove('pb-view-mode');
                document.getElementById('view-bar').classList.add('hidden');
                modeToggle.classList.remove('hidden');
                document.getElementById('editor-save-btn').classList.remove('hidden');
                document.getElementById('editor-delete-btn').classList.remove('hidden');
                document.getElementById('mermaid-open-btn').classList.toggle('hidden', noteMode !== 'rich');
                ['editor-title', 'editor-role', 'editor-category', 'editor-company'].forEach(function (id) {
                    document.getElementById(id).readOnly = false;
                });
                if (noteMode === 'md') {
                    mdEditor.classList.remove('hidden');
                } else {
                    richWrap.classList.remove('view-mode');
                    quill.enable(true);
                }
            }

            /* Save — localStorage dulu (instant), lalu sync ke server di background.
               syncToServer() & apiFetch() berasal dari dashboard-core.js. */
            function saveNotes() {
                var allNotes = loadCourseNotes();
                allNotes[courseId] = {
                    title: document.getElementById('editor-title').value.trim(),
                    badges: {
                        role: document.getElementById('editor-role').value.trim(),
                        subCategory: document.getElementById('editor-category').value.trim(),
                        company: document.getElementById('editor-company').value.trim(),
                    },
                    mode: noteMode,
                    content: noteMode === 'md' ? mdEditor.value : quill.root.innerHTML,
                    updatedAt: new Date().toISOString(),
                };
                saveCourseNotes(allNotes);
                updateTitle();
                setStatus('Tersimpan.');

                if (typeof syncToServer === 'function') {
                    syncToServer().catch(function () {
                        setStatus('Tersimpan lokal. Gagal sync ke server.', true);
                    });
                }
            }

            function autoSave() {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveNotes, 800);
            }

            /* Delete notes — pakai confirm modal lokal (self-contained di halaman ini) */
            function deleteNotes() {
                showLocalConfirm('Hapus Catatan', 'Yakin ingin menghapus catatan course ini?', function () {
                    var allNotes = loadCourseNotes();
                    delete allNotes[courseId];
                    saveCourseNotes(allNotes);
                    quill.setText('');
                    mdEditor.value = '';
                    setCourseViewed(courseId, false);
                    exitViewMode();
                    setStatus('Catatan dihapus.');
                    if (typeof syncToServer === 'function') syncToServer().catch(function () { });
                });
            }

            function showLocalConfirm(title, message, onConfirm) {
                document.getElementById('confirm-title').textContent = title;
                document.getElementById('confirm-body').textContent = message;
                confirmCallback = onConfirm;
                document.getElementById('confirm-modal').classList.add('is-open');
            }

            document.getElementById('confirm-ok').addEventListener('click', function () {
                document.getElementById('confirm-modal').classList.remove('is-open');
                if (typeof confirmCallback === 'function') confirmCallback();
                confirmCallback = null;
            });
            document.getElementById('confirm-cancel').addEventListener('click', function () {
                document.getElementById('confirm-modal').classList.remove('is-open');
                confirmCallback = null;
            });

            /* ======== MODE SWITCH — Rich Text / Markdown ======== */

            function setEditorMode(mode) {
                noteMode = mode;
                document.querySelectorAll('#editor-mode-toggle .btn-group__item').forEach(function (b) {
                    b.classList.toggle('btn-group__item--active', b.dataset.mode === mode);
                });
                var mermaidBtn = document.getElementById('mermaid-open-btn');
                if (mermaidBtn) mermaidBtn.classList.toggle('hidden', mode !== 'rich');
                richWrap.classList.toggle('hidden', mode !== 'rich');
                mdWrap.classList.toggle('hidden', mode !== 'md');
            }

            var previewTimer = null;

            async function updateMdPreview() {
                var md = mdEditor.value;
                if (typeof marked === 'undefined') {
                    mdPreview.innerHTML = '<pre>' + escapeHtml(md) + '</pre>';
                    return;
                }
                var re = /```mermaid\s*([\s\S]*?)```/g;
                var segs = [], last = 0, m;
                while ((m = re.exec(md))) {
                    segs.push({ type: 'md', text: md.slice(last, m.index) });
                    segs.push({ type: 'mermaid', code: m[1].trim() });
                    last = m.index + m[0].length;
                }
                segs.push({ type: 'md', text: md.slice(last) });
                var out = '';
                for (var i = 0; i < segs.length; i++) {
                    var seg = segs[i];
                    if (seg.type === 'md') {
                        out += marked.parse(seg.text || '', { gfm: true, breaks: true });
                    } else {
                        try {
                            var id = 'pv-' + Date.now() + '-' + i;
                            var r = await mermaid.render(id, seg.code);
                            out += '<div class="md-mermaid">' + r.svg + '</div>';
                        } catch (e) {
                            out += '<div class="md-mermaid-error">Mermaid error: ' + escapeHtml(e.message || String(e)) + '</div>';
                        }
                    }
                }
                mdPreview.innerHTML = out;
            }

            function quillHtmlToMarkdown(html) {
                if (typeof TurndownService === 'undefined') return html;
                var td = new TurndownService({ headingStyle: 'atx', codeBlockStyle: 'fenced' });
                td.addRule('mermaid', {
                    filter: function (node) {
                        return node.classList && node.classList.contains('ql-mermaid');
                    },
                    replacement: function (content, node) {
                        var code = node.getAttribute('data-mermaid-code') || '';
                        return '\n\n```mermaid\n' + code + '\n```\n\n';
                    }
                });
                return td.turndown(html);
            }

            async function mdToQuillHtml(md) {
                if (typeof marked === 'undefined') return '<pre>' + escapeHtml(md) + '</pre>';
                var re = /```mermaid\s*([\s\S]*?)```/g;
                var segs = [];
                var last = 0, m;
                while ((m = re.exec(md))) {
                    segs.push({ type: 'md', text: md.slice(last, m.index) });
                    segs.push({ type: 'mermaid', code: m[1].trim() });
                    last = m.index + m[0].length;
                }
                segs.push({ type: 'md', text: md.slice(last) });
                var out = '';
                for (var i = 0; i < segs.length; i++) {
                    var seg = segs[i];
                    if (seg.type === 'md') {
                        out += marked.parse(seg.text || '');
                    } else {
                        try {
                            var id = 'mm-' + Date.now() + '-' + i;
                            var r = await mermaid.render(id, seg.code);
                            out += '<div class="ql-mermaid" data-mermaid-code="' + escapeHtml(seg.code) + '" contenteditable="false">' + r.svg + '</div><p><br></p>';
                        } catch (e) {
                            out += '<pre><code>' + escapeHtml(seg.code) + '</code></pre>';
                        }
                    }
                }
                return out;
            }

            async function switchToMarkdown() {
                var html = quill.root.innerHTML;
                mdEditor.value = quillHtmlToMarkdown(html);
                setEditorMode('md');
                updateMdPreview();
            }

            async function switchToRich() {
                var html = await mdToQuillHtml(mdEditor.value);
                quill.clipboard.dangerouslyPasteHTML(html, 'silent');
                setEditorMode('rich');
                renderAllMermaidBlocks();
            }

            if (modeToggle) {
                modeToggle.addEventListener('click', function (e) {
                    var btn = e.target.closest('.btn-group__item');
                    if (!btn) return;
                    var mode = btn.dataset.mode;
                    if (mode === noteMode) return;
                    if (mode === 'md') switchToMarkdown();
                    else switchToRich();
                    autoSave();
                });
            }
            if (mdEditor) {
                mdEditor.addEventListener('input', function () {
                    clearTimeout(previewTimer);
                    previewTimer = setTimeout(updateMdPreview, 300);
                    autoSave();
                });
            }

            /* ======== MERMAID ======== */

            function openMermaidModal() {
                var range = quill.getSelection(true);
                mermaidInsertIndex = range ? range.index : quill.getLength();
                document.getElementById('mermaid-code').value = '';
                document.getElementById('mermaid-preview').innerHTML = '';
                document.getElementById('mermaid-modal').classList.add('is-open');
                reinitLucide();
            }

            async function renderMermaidPreview() {
                var code = document.getElementById('mermaid-code').value.trim();
                var container = document.getElementById('mermaid-preview');
                if (!code) { container.innerHTML = ''; return; }
                try {
                    var id = 'mermaid-preview-' + Date.now();
                    var result = await mermaid.render(id, code);
                    container.innerHTML = result.svg;
                } catch (e) {
                    container.innerHTML = '<p class="text-muted" style="color:var(--color-danger);">Error: ' + escapeHtml(e.message || String(e)) + '</p>';
                }
            }

            async function insertMermaid() {
                var code = document.getElementById('mermaid-code').value.trim();
                if (!code) return;

                var html;
                try {
                    var id = 'mermaid-insert-' + Date.now();
                    var result = await mermaid.render(id, code);
                    html = '<div class="ql-mermaid" data-mermaid-code="' + escapeHtml(code) + '" contenteditable="false">' + result.svg + '</div><p><br></p>';
                } catch (e) {
                    html = '<pre><code>' + escapeHtml(code) + '</code></pre>';
                }
                quill.clipboard.dangerouslyPasteHTML(mermaidInsertIndex, html, 'silent');
                document.getElementById('mermaid-modal').classList.remove('is-open');
                autoSave();
            }

            /* Render ulang semua block mermaid yang tersimpan sebagai HTML/SVG statis
               (dipanggil saat load, karena SVG disimpan langsung, bukan di-render ulang tiap saat) */
            function renderAllMermaidBlocks() {
                var blocks = quill.root.querySelectorAll('.ql-mermaid svg');
                blocks.forEach(function (svg) { svg.style.maxWidth = '100%'; });
            }

            /* Klik dua kali block Mermaid untuk edit ulang */
            quill.root.addEventListener('dblclick', function (e) {
                var mermaidBlock = e.target.closest('.ql-mermaid');
                if (!mermaidBlock) return;
                var code = mermaidBlock.dataset.mermaidCode;
                if (!code) return;
                mermaidInsertIndex = getCaretIndex(mermaidBlock);
                document.getElementById('mermaid-code').value = code;
                document.getElementById('mermaid-modal').classList.add('is-open');
                renderMermaidPreview();
                reinitLucide();
            });

            function getCaretIndex(target) {
                var children = quill.root.children;
                for (var i = 0; i < children.length; i++) {
                    if (children[i].contains(target)) return quill.getIndex(children[i]);
                }
                return quill.getLength();
            }

            /* Init */
            loadCourseInfo();
            loadNotes();
            var _viewAll = loadCourseNotes();
            if (isCourseViewed(courseId) || (_viewAll[courseId] && _viewAll[courseId].viewed)) enterViewMode();

            /* Event listeners */
            ['editor-title', 'editor-role', 'editor-category', 'editor-company'].forEach(function (id) {
                document.getElementById(id).addEventListener('input', autoSave);
            });

            quill.on('text-change', function (delta, oldDelta, source) {
                if (source === 'user') autoSave();
            });
            document.getElementById('editor-save-btn').addEventListener('click', function () {
                saveNotes();
                setCourseViewed(courseId, true);
                var _nn = loadCourseNotes();
                if (_nn[courseId]) { _nn[courseId].viewed = true; saveCourseNotes(_nn); }
                enterViewMode();
            });
            document.getElementById('editor-delete-btn').addEventListener('click', deleteNotes);
            document.getElementById('edit-btn').addEventListener('click', function () {
                setCourseViewed(courseId, false);
                var _nn = loadCourseNotes();
                if (_nn[courseId]) { _nn[courseId].viewed = false; saveCourseNotes(_nn); }
                exitViewMode();
            });
            var zoomIn = document.getElementById('zoom-in');
            var zoomOut = document.getElementById('zoom-out');
            if (zoomIn) zoomIn.addEventListener('click', function () { setPbZoom(pbZoom + pbZoomStep); });
            if (zoomOut) zoomOut.addEventListener('click', function () { setPbZoom(pbZoom - pbZoomStep); });

            /* Mermaid modal */
            document.getElementById('mermaid-open-btn').addEventListener('click', openMermaidModal);
            document.getElementById('mermaid-preview-btn').addEventListener('click', renderMermaidPreview);
            document.getElementById('mermaid-insert').addEventListener('click', insertMermaid);
            document.getElementById('mermaid-cancel').addEventListener('click', function () {
                document.getElementById('mermaid-modal').classList.remove('is-open');
            });

            if (window.lucide) lucide.createIcons();

        })();
    </script>
</body>

</html>
