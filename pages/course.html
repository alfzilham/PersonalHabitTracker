<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Notes — Personal Habit Tracker</title>

    <link rel="icon" type="image/x-icon" href="../assets/favicon/favicon.ico">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devchauhann/fonts@v1.1.0/cdn/v1/css/all.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.snow.css">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

    <div class="course-page" id="course-root">

        <!-- Back button -->
        <nav class="course-nav">
            <a href="../index.html" class="btn-back"><i data-lucide="arrow-left"></i> Back to Dashboard</a>
        </nav>

        <!-- Course info -->
        <div class="course-header">
            <input class="course-header__title" type="text" id="editor-title" placeholder="Nama course" autocomplete="off">
            <div class="course-header__badges">
                <input class="badge-input" type="text" id="editor-role" placeholder="Role" autocomplete="off">
                <input class="badge-input" type="text" id="editor-category" placeholder="Category" autocomplete="off">
                <input class="badge-input" type="text" id="editor-company" placeholder="Company" autocomplete="off">
            </div>
        </div>

        <!-- Quill Editor -->
        <div class="card">
            <div class="editor-header">
                <h2 class="text-xl font-bold text-primary font-serif">Course Notes</h2>
                <button type="button" class="btn btn-secondary btn-sm" id="mermaid-open-btn">
                    <i data-lucide="workflow"></i> Diagram
                </button>
            </div>
            <div id="editor-container"></div>
            <div class="editor-actions">
                <span class="editor-status" id="editor-status"></span>
                <div class="editor-actions__right">
                    <button class="btn btn-ghost" id="editor-delete-btn"><i data-lucide="trash-2"></i> Hapus</button>
                    <button class="btn btn-primary" id="editor-save-btn"><i data-lucide="check"></i> Simpan</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Mermaid Modal -->
    <div class="modal-overlay" id="mermaid-modal">
        <div class="modal" style="max-width:600px;">
            <h3 class="modal__title">Tambah Diagram Mermaid</h3>
            <div class="modal__form">
                <div class="modal__field">
                    <label class="modal__label">Kode Mermaid</label>
                    <textarea class="modal__input" id="mermaid-code" rows="8"
                        placeholder="graph TD;&#10;  A[Start] --> B[End]"
                        style="font-family:var(--font-mono);font-size:var(--text-sm);resize:vertical;"></textarea>
                </div>
                <div class="modal__field">
                    <label class="modal__label">Preview</label>
                    <div id="mermaid-preview" class="ql-mermaid-preview"></div>
                </div>
                <div class="modal__actions">
                    <button class="btn btn-ghost" id="mermaid-cancel">Batal</button>
                    <button class="btn btn-secondary" id="mermaid-preview-btn"><i data-lucide="eye"></i>
                        Preview</button>
                    <button class="btn btn-primary" id="mermaid-insert"><i data-lucide="plus"></i> Insert</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirm Modal (self-contained, tidak bergantung ke index.html) -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal modal--confirm">
            <h3 class="modal__title" id="confirm-title">Konfirmasi</h3>
            <p class="modal__body" id="confirm-body"></p>
            <div class="modal__actions">
                <button class="btn btn-ghost" id="confirm-cancel">Batal</button>
                <button class="btn btn-primary" id="confirm-ok"><i data-lucide="check"></i> Ya</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.0/dist/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'neutral', securityLevel: 'loose' });</script>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/data-study.js"></script>
    <script src="../assets/js/study-db.js"></script>
    <script src="../assets/js/dashboard-i18n.js"></script>
    <script src="../assets/js/dashboard-core.js"></script>

    <script>
        (function () {
            var params = new URLSearchParams(window.location.search);
            var courseId = params.get('id');
            var saveTimer = null;
            var statusEl = document.getElementById('editor-status');
            var mermaidInsertIndex = null;
            var confirmCallback = null;

            if (!courseId) {
                document.getElementById('course-root').innerHTML =
                    '<nav class="course-nav"><a href="../index.html" class="btn-back"><i data-lucide="arrow-left"></i> Back to Dashboard</a></nav>' +
                    '<div class="card" style="padding:var(--space-10);text-align:center;margin-top:var(--space-8);"><p class="text-muted">Course not found.</p></div>';
                if (window.lucide) lucide.createIcons();
                return;
            }

            /* Init Quill — toolbar tanpa custom format button (mencegah toolbar rusak/overflow).
               Mermaid diinsert lewat tombol terpisah "Diagram" di header card. */
            var quill = new Quill('#editor-container', {
                theme: 'snow',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, false] }],
                        ['bold', 'italic', 'underline'],
                        [{ 'list': 'bullet' }, { 'list': 'ordered' }],
                        ['link', 'code-block'],
                        ['clean']
                    ]
                },
                placeholder: 'Tulis catatan course Anda di sini...'
            });

            /* Load existing course info & notes */
            function loadCourseInfo() {
                try {
                    var raw = localStorage.getItem('custom_courses');
                    if (raw) {
                        var list = JSON.parse(raw);
                        var course = list.find(function (c) { return c.id === courseId; });
                        if (course) {
                            document.getElementById('editor-title').value = course.title || '';
                            document.getElementById('editor-role').value = course.role || '';
                            document.getElementById('editor-category').value = course.subCategory || '';
                            document.getElementById('editor-company').value = course.company || '';
                        }
                    }
                } catch (e) { }
            }

            function loadNotes() {
                var allNotes = loadCourseNotes();
                var note = allNotes[courseId];
                if (note) {
                    if (note.title) document.getElementById('editor-title').value = note.title;
                    if (note.badges) {
                        if (note.badges.role) document.getElementById('editor-role').value = note.badges.role;
                        if (note.badges.subCategory) document.getElementById('editor-category').value = note.badges.subCategory;
                        if (note.badges.company) document.getElementById('editor-company').value = note.badges.company;
                    }
                    if (note.content) {
                        quill.root.innerHTML = note.content;
                        renderAllMermaidBlocks();
                    }
                }
                updateTitle();
            }

            function updateTitle() {
                var t = document.getElementById('editor-title').value.trim();
                document.title = (t || 'Course Notes') + ' \u2014 Personal Habit Tracker';
            }

            function setStatus(msg, isError) {
                statusEl.textContent = msg;
                statusEl.style.color = isError ? 'var(--color-danger)' : 'var(--color-sage)';
                clearTimeout(statusEl._timer);
                statusEl._timer = setTimeout(function () { statusEl.textContent = ''; }, 3000);
            }

            /* Save — localStorage dulu (instant), lalu sync ke server di background.
               syncToServer() & apiFetch() berasal dari dashboard-core.js. */
            function saveNotes() {
                var allNotes = loadCourseNotes();
                allNotes[courseId] = {
                    title: document.getElementById('editor-title').value.trim(),
                    badges: {
                        role: document.getElementById('editor-role').value.trim(),
                        subCategory: document.getElementById('editor-category').value.trim(),
                        company: document.getElementById('editor-company').value.trim(),
                    },
                    content: quill.root.innerHTML,
                    updatedAt: new Date().toISOString(),
                };
                saveCourseNotes(allNotes);
                updateTitle();
                setStatus('Tersimpan.');

                if (typeof syncToServer === 'function') {
                    syncToServer().catch(function () {
                        setStatus('Tersimpan lokal. Gagal sync ke server.', true);
                    });
                }
            }

            function autoSave() {
                clearTimeout(saveTimer);
                saveTimer = setTimeout(saveNotes, 800);
            }

            /* Delete notes — pakai confirm modal lokal (self-contained di halaman ini) */
            function deleteNotes() {
                showLocalConfirm('Hapus Catatan', 'Yakin ingin menghapus catatan course ini?', function () {
                    var allNotes = loadCourseNotes();
                    delete allNotes[courseId];
                    saveCourseNotes(allNotes);
                    quill.setText('');
                    setStatus('Catatan dihapus.');
                    if (typeof syncToServer === 'function') syncToServer().catch(function () { });
                });
            }

            function showLocalConfirm(title, message, onConfirm) {
                document.getElementById('confirm-title').textContent = title;
                document.getElementById('confirm-body').textContent = message;
                confirmCallback = onConfirm;
                document.getElementById('confirm-modal').classList.add('is-open');
            }

            document.getElementById('confirm-ok').addEventListener('click', function () {
                document.getElementById('confirm-modal').classList.remove('is-open');
                if (typeof confirmCallback === 'function') confirmCallback();
                confirmCallback = null;
            });
            document.getElementById('confirm-cancel').addEventListener('click', function () {
                document.getElementById('confirm-modal').classList.remove('is-open');
                confirmCallback = null;
            });

            /* ======== MERMAID ======== */

            function openMermaidModal() {
                var range = quill.getSelection(true);
                mermaidInsertIndex = range ? range.index : quill.getLength();
                document.getElementById('mermaid-code').value = '';
                document.getElementById('mermaid-preview').innerHTML = '';
                document.getElementById('mermaid-modal').classList.add('is-open');
                reinitLucide();
            }

            async function renderMermaidPreview() {
                var code = document.getElementById('mermaid-code').value.trim();
                var container = document.getElementById('mermaid-preview');
                if (!code) { container.innerHTML = ''; return; }
                try {
                    var id = 'mermaid-preview-' + Date.now();
                    var result = await mermaid.render(id, code);
                    container.innerHTML = result.svg;
                } catch (e) {
                    container.innerHTML = '<p class="text-muted" style="color:var(--color-danger);">Error: ' + escapeHtml(e.message || String(e)) + '</p>';
                }
            }

            async function insertMermaid() {
                var code = document.getElementById('mermaid-code').value.trim();
                if (!code) return;

                var html;
                try {
                    var id = 'mermaid-insert-' + Date.now();
                    var result = await mermaid.render(id, code);
                    html = '<div class="ql-mermaid" data-mermaid-code="' + escapeHtml(code) + '" contenteditable="false">' + result.svg + '</div><p><br></p>';
                } catch (e) {
                    html = '<pre><code>' + escapeHtml(code) + '</code></pre>';
                }
                quill.clipboard.dangerouslyPasteHTML(mermaidInsertIndex, html, 'silent');
                document.getElementById('mermaid-modal').classList.remove('is-open');
                autoSave();
            }

            /* Render ulang semua block mermaid yang tersimpan sebagai HTML/SVG statis
               (dipanggil saat load, karena SVG disimpan langsung, bukan di-render ulang tiap saat) */
            function renderAllMermaidBlocks() {
                var blocks = quill.root.querySelectorAll('.ql-mermaid svg');
                blocks.forEach(function (svg) { svg.style.maxWidth = '100%'; });
            }

            /* Klik dua kali block Mermaid untuk edit ulang */
            quill.root.addEventListener('dblclick', function (e) {
                var mermaidBlock = e.target.closest('.ql-mermaid');
                if (!mermaidBlock) return;
                var code = mermaidBlock.dataset.mermaidCode;
                if (!code) return;
                mermaidInsertIndex = getCaretIndex(mermaidBlock);
                document.getElementById('mermaid-code').value = code;
                document.getElementById('mermaid-modal').classList.add('is-open');
                renderMermaidPreview();
                reinitLucide();
            });

            function getCaretIndex(target) {
                var children = quill.root.children;
                for (var i = 0; i < children.length; i++) {
                    if (children[i].contains(target)) return quill.getIndex(children[i]);
                }
                return quill.getLength();
            }

            /* Init */
            loadCourseInfo();
            loadNotes();

            /* Event listeners */
            ['editor-title', 'editor-role', 'editor-category', 'editor-company'].forEach(function (id) {
                document.getElementById(id).addEventListener('input', autoSave);
            });

            quill.on('text-change', function (delta, oldDelta, source) {
                if (source === 'user') autoSave();
            });
            document.getElementById('editor-save-btn').addEventListener('click', saveNotes);
            document.getElementById('editor-delete-btn').addEventListener('click', deleteNotes);

            /* Mermaid modal */
            document.getElementById('mermaid-open-btn').addEventListener('click', openMermaidModal);
            document.getElementById('mermaid-preview-btn').addEventListener('click', renderMermaidPreview);
            document.getElementById('mermaid-insert').addEventListener('click', insertMermaid);
            document.getElementById('mermaid-cancel').addEventListener('click', function () {
                document.getElementById('mermaid-modal').classList.remove('is-open');
            });

            if (window.lucide) lucide.createIcons();

        })();
    </script>
</body>

</html>
